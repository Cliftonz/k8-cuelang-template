name: Autofix Dispatcher
on:
  workflow_run:
    workflows: [CI, E2E]
    types: [completed]
  workflow_dispatch:
    inputs:
      sha:
        description: Commit SHA to evaluate
        required: true
      pr:
        description: PR number
        required: true

permissions:
  pull-requests: write
  actions: read
  contents: read

jobs:
  dispatch:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.event == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      # Intentionally check out the base repo's default branch (no `ref:` override).
      # This workflow runs in a privileged context (pull-requests: write) via
      # workflow_run, so executing code from a fork's head SHA would let a fork PR
      # inject malicious scripts. The SHA/PR we operate on is read from the
      # workflow_run event payload below, not from the fork checkout.
      - uses: actions/checkout@v5

      - name: Install yq
        run: |
          curl -fsSL -o /usr/local/bin/yq "https://github.com/mikefarah/yq/releases/download/v4.44.3/yq_linux_amd64"
          chmod +x /usr/local/bin/yq

      - name: Resolve PR + SHA
        id: ctx
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            SHA="${{ github.event.inputs.sha }}"
            PR="${{ github.event.inputs.pr }}"
          else
            SHA="${{ github.event.workflow_run.head_sha }}"
            PR=$(gh api "repos/${{ github.repository }}/commits/${SHA}/pulls" --jq '.[0].number // empty')
          fi
          if [ -z "${PR:-}" ]; then
            echo "no PR associated with SHA ${SHA}; exiting"
            exit 0
          fi
          echo "sha=${SHA}"   >> "$GITHUB_OUTPUT"
          echo "pr=${PR}"     >> "$GITHUB_OUTPUT"

      - name: Wait for all workflow runs on this SHA to complete
        if: steps.ctx.outputs.pr != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          SHA="${{ steps.ctx.outputs.sha }}"
          SELF_RUN_ID="${{ github.run_id }}"
          # Poll up to 15 min (60 × 15s).
          for i in $(seq 1 60); do
            pending=$(gh api "repos/${{ github.repository }}/actions/runs?head_sha=${SHA}&per_page=100" --paginate \
              --jq "[.workflow_runs[] | select(.id != ${SELF_RUN_ID} and .status != \"completed\")] | length")
            if [ "$pending" -eq 0 ]; then
              echo "all runs complete"
              exit 0
            fi
            echo "waiting on ${pending} pending run(s)…"
            sleep 15
          done
          echo "timed out waiting; proceeding anyway"

      - name: Dispatch autofix comment
        if: steps.ctx.outputs.pr != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          SHA: ${{ steps.ctx.outputs.sha }}
          PR: ${{ steps.ctx.outputs.pr }}
        run: ./ci/scripts/autofix-dispatch.sh
