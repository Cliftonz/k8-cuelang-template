name: Publish OCI artifact

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch: {}

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      # jarvy isn't installed on the runner; bypass the Makefile dev-env gate.
      SKIP_JARVY_DOCTOR: "1"
    steps:
      - uses: actions/checkout@v5

      - name: Install CUE
        run: |
          curl -fsSL "https://github.com/cue-lang/cue/releases/download/v0.16.1/cue_v0.16.1_linux_amd64.tar.gz" | tar -xz
          install -m 0755 cue /usr/local/bin/cue

      - name: Install yq
        run: |
          curl -fsSL -o /usr/local/bin/yq "https://github.com/mikefarah/yq/releases/download/v4.44.3/yq_linux_amd64"
          chmod +x /usr/local/bin/yq

      - name: Install ORAS
        run: |
          curl -fsSL "https://github.com/oras-project/oras/releases/download/v1.2.0/oras_1.2.0_linux_amd64.tar.gz" | tar -xz
          install -m 0755 oras /usr/local/bin/oras

      - name: Login to GHCR
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | oras login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Render preview cluster
        run: make export-cluster CLUSTER=preview UNIFI=true

      - name: Publish OCI artifact
        env:
          OCI_REF: ghcr.io/${{ github.repository }}/manifests:${{ github.sha }}
          CLUSTER: preview
        run: ./ci/scripts/publish.sh

      - name: Summary
        run: |
          echo "Published: ghcr.io/${{ github.repository }}/manifests:${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
