# cilium-bpf-watchdog — see docs/adr/006-cilium-socketlb-watchdog.md
#
# After a node reboot the cilium-agent pod looks healthy but BPF
# socket-LB cgroup hooks aren't re-attached to existing pods on that
# node. Symptom: pods on the affected node ECONNREFUSED / TLS timeout
# when dialing any ClusterIP (10.96.0.1:443 apiserver included),
# while pod-IP direct dials still work. Manual fix is `kubectl -n
# kube-system delete pod cilium-<hash-on-that-node>`. This watchdog
# automates that detection + recycle.
#
# Probe is intentionally minimal: TCP connect to the kubernetes
# Service VIP every 30s with a 5s timeout. Three consecutive failures
# trigger one delete of the local cilium-agent pod (via downward API
# nodeName). Strike counter resets on success.
#
# RBAC is scoped to: list cilium-agent pods (label-selector
# k8s-app=cilium) + delete same pods, namespace kube-system only.
# Cannot touch any other resource.
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: cilium-bpf-watchdog
  namespace: kube-system
  labels:
    app.kubernetes.io/name: cilium-bpf-watchdog
    app.kubernetes.io/component: post-reboot-recovery
    app.kubernetes.io/managed-by: infrastructure-cilium
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: cilium-bpf-watchdog
  namespace: kube-system
  labels:
    app.kubernetes.io/name: cilium-bpf-watchdog
rules:
  # List cilium-agent pods to find the one on this node.
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list"]
  # Delete the local cilium-agent pod on detection.
  # DaemonSet controller recreates it within ~30s.
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: cilium-bpf-watchdog
  namespace: kube-system
  labels:
    app.kubernetes.io/name: cilium-bpf-watchdog
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: cilium-bpf-watchdog
subjects:
  - kind: ServiceAccount
    name: cilium-bpf-watchdog
    namespace: kube-system
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: cilium-bpf-watchdog
  namespace: kube-system
  labels:
    app.kubernetes.io/name: cilium-bpf-watchdog
    app.kubernetes.io/component: post-reboot-recovery
    app.kubernetes.io/managed-by: infrastructure-cilium
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: cilium-bpf-watchdog
  updateStrategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
  template:
    metadata:
      labels:
        app.kubernetes.io/name: cilium-bpf-watchdog
        app.kubernetes.io/component: post-reboot-recovery
    spec:
      serviceAccountName: cilium-bpf-watchdog
      # Run on every node, including the control plane — the bug
      # affects any node, and the CP node is where ArgoCD's
      # repo-server lives.
      tolerations:
        - operator: Exists
      priorityClassName: system-node-critical
      # NOT hostNetwork — we explicitly want the probe to traverse
      # the pod network so it exercises the same BPF socket-LB path
      # that breaks.
      restartPolicy: Always
      terminationGracePeriodSeconds: 10
      containers:
        - name: watchdog
          image: bitnami/kubectl:1.31.1
          imagePullPolicy: IfNotPresent
          env:
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            # kubernetes apiserver Service VIP. If your cluster uses
            # a non-default service CIDR, override here.
            - name: PROBE_TARGET
              value: "10.96.0.1"
            - name: PROBE_PORT
              value: "443"
            - name: PROBE_INTERVAL_SECONDS
              value: "30"
            - name: PROBE_TIMEOUT_SECONDS
              value: "5"
            - name: STRIKES_BEFORE_RECYCLE
              value: "3"
            # Cooldown after a recycle action, in seconds. Prevents
            # rapid-fire recycle if the new agent also fails to
            # attach (which would indicate a different problem the
            # watchdog can't fix).
            - name: RECYCLE_COOLDOWN_SECONDS
              value: "300"
          command: ["/bin/bash", "-c"]
          args:
            - |
              set -uo pipefail
              echo "[cilium-watchdog] starting on node=${NODE_NAME} probe=${PROBE_TARGET}:${PROBE_PORT}"

              strikes=0
              last_recycle_epoch=0

              while true; do
                # bash /dev/tcp probe — no external tooling needed.
                if timeout "${PROBE_TIMEOUT_SECONDS}" \
                     bash -c "exec 3<>/dev/tcp/${PROBE_TARGET}/${PROBE_PORT}" \
                     2>/dev/null; then
                  if [ "${strikes}" -gt 0 ]; then
                    echo "[cilium-watchdog] probe ok; resetting strikes (was ${strikes})"
                  fi
                  strikes=0
                else
                  strikes=$((strikes + 1))
                  echo "[cilium-watchdog] probe FAIL ${PROBE_TARGET}:${PROBE_PORT} strikes=${strikes}/${STRIKES_BEFORE_RECYCLE}"

                  if [ "${strikes}" -ge "${STRIKES_BEFORE_RECYCLE}" ]; then
                    now=$(date +%s)
                    since_last=$((now - last_recycle_epoch))
                    if [ "${since_last}" -lt "${RECYCLE_COOLDOWN_SECONDS}" ]; then
                      echo "[cilium-watchdog] cooldown active (${since_last}s < ${RECYCLE_COOLDOWN_SECONDS}s); skipping recycle"
                    else
                      pod=$(kubectl -n kube-system get pods \
                              -l k8s-app=cilium \
                              --field-selector "spec.nodeName=${NODE_NAME}" \
                              -o jsonpath='{.items[0].metadata.name}' 2>/dev/null || true)
                      if [ -z "${pod}" ]; then
                        echo "[cilium-watchdog] no cilium-agent pod found on ${NODE_NAME}; skipping recycle"
                      else
                        echo "[cilium-watchdog] recycling ${pod} on ${NODE_NAME}"
                        if kubectl -n kube-system delete pod "${pod}" --grace-period=10; then
                          last_recycle_epoch=${now}
                          strikes=0
                          # Sleep extra so the new pod has time to come up
                          # before the next probe — DaemonSet controller
                          # typically schedules within 5-15s, agent Ready
                          # in another 15-30s.
                          sleep 45
                        else
                          echo "[cilium-watchdog] delete failed; will retry next interval"
                        fi
                      fi
                    fi
                  fi
                fi

                sleep "${PROBE_INTERVAL_SECONDS}"
              done
          resources:
            requests:
              cpu: 5m
              memory: 16Mi
            limits:
              memory: 64Mi
          securityContext:
            runAsNonRoot: true
            runAsUser: 1001
            runAsGroup: 1001
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
