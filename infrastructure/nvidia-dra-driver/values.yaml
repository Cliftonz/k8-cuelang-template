# Values for the NVIDIA DRA driver Helm chart, tuned for Talos + the home
# cluster. Adjust gpu.resources / gpuResourcesEnabledOverride per the
# upstream chart README:
#   https://github.com/NVIDIA/k8s-dra-driver-gpu/tree/main/deployments/helm
#
# Talos specifics:
#   - `nvidiaDriverRoot: /usr/local`  — Talos's NVIDIA system extension
#     installs the driver at /usr/local/nvidia, mounted into containers.
#   - Privileged containers are required for /dev/nvidia* + cgroup access.
#     The `nvidia-dra-driver-gpu` namespace must carry the privileged PSS
#     label; the install script applies it.

resources:
  gpus:
    enabled: true

# DRA driver expects the NVIDIA driver libs at this prefix on the host —
# matches where the Talos NVIDIA extension installs them.
nvidiaDriverRoot: /usr/local

# Force-enable the GPU resource plugin even if k8s thinks DRA is alpha
# (older clusters). On 1.34+ this is a no-op.
gpuResourcesEnabledOverride: true

# Run the kubelet-plugin DaemonSet only on nodes that actually have GPUs.
# Saves ~80 MiB per non-GPU node.
nodeSelector:
  nvidia.com/gpu.present: "true"

# Tolerate the standard NVIDIA taint workloads use.
tolerations:
  - key: nvidia.com/gpu
    operator: Exists
    effect: NoSchedule

resources_:
  controller:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 256Mi
  kubeletPlugin:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 256Mi
