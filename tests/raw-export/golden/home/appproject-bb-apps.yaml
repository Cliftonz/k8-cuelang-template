apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: bb-apps
  namespace: argocd
  labels:
    app.kubernetes.io/managed-by: k8-infra
    app.kubernetes.io/part-of: platform
    infra.k8/tier: production
    infra.k8/cluster: home
    infra.k8/owner: platform-team
spec:
  description: Example Org long-lived apps — single-container deploys via app-template
  destinations:
    - namespace: bb-*
      server: https://kubernetes.default.svc
  sourceRepos:
    - https://bjw-s-labs.github.io/helm-charts
  clusterResourceWhitelist:
    - group: ""
      kind: Namespace
  namespaceResourceWhitelist:
    - group: ""
      kind: '*'
    - group: apps
      kind: '*'
    - group: networking.k8s.io
      kind: '*'
    - group: autoscaling
      kind: '*'
    - group: policy
      kind: '*'
