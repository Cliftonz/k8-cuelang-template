apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: claude-oauth-refresher
  labels:
    app.kubernetes.io/managed-by: k8-infra
    app.kubernetes.io/part-of: platform
    infra.k8/tier: production
    infra.k8/cluster: home
    infra.k8/owner: platform-team
rules:
  - apiGroups:
      - ""
    resources:
      - secrets
    resourceNames:
      - openbao-keys
    verbs:
      - get
  - apiGroups:
      - external-secrets.io
    resources:
      - externalsecrets
    resourceNames:
      - claude-code-oauth
    verbs:
      - get
      - patch
      - update
