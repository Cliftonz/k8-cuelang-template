apiVersion: batch/v1
kind: CronJob
metadata:
  name: quiet-hours-enter
  namespace: kelos-system
  labels:
    app.kubernetes.io/managed-by: k8-infra
    app.kubernetes.io/part-of: platform
    infra.k8/tier: production
    infra.k8/cluster: home
    infra.k8/owner: platform-team
spec:
  schedule: 0 8 * * 1-5
  timeZone: America/New_York
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 1
  jobTemplate:
    spec:
      template:
        spec:
          serviceAccountName: quiet-hours-toggle
          restartPolicy: OnFailure
          containers:
            - name: toggle
              image: alpine/k8s:1.31.1@sha256:dfe8c7a06c41d0b6e8757da99531f8f302e9a2687fa0155af4c4087df585c9c8
              command:
                - /bin/sh
                - -c
                - |-
                  set -eu
                  git clone --depth 1 https://github.com/example-org/k8-infra.git /tmp/infra
                  export MODE=enter
                  exec bash /tmp/infra/ci/scripts/quiet-hours-toggle.sh
              resources:
                requests:
                  cpu: 10m
                  memory: 64Mi
                limits:
                  cpu: 200m
                  memory: 256Mi
              securityContext:
                runAsNonRoot: true
                runAsUser: 65532
                runAsGroup: 65532
                allowPrivilegeEscalation: false
                capabilities:
                  drop:
                    - ALL
                seccompProfile:
                  type: RuntimeDefault
