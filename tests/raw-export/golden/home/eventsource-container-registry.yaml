apiVersion: argoproj.io/v1alpha1
kind: EventSource
metadata:
  name: container-registry
  namespace: argo-events
  labels:
    app.kubernetes.io/managed-by: k8-infra
    app.kubernetes.io/part-of: platform
    infra.k8/tier: production
    infra.k8/cluster: home
    infra.k8/owner: platform-team
spec:
  service:
    ports:
      - port: 13000
        targetPort: 13000
  webhook:
    image-push:
      endpoint: /registry/push
      port: "13000"
      method: POST
