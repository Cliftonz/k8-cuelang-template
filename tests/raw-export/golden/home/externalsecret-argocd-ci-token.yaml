apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: argocd-ci-token
  namespace: argo-events
  labels:
    app.kubernetes.io/managed-by: k8-infra
    app.kubernetes.io/part-of: platform
    infra.k8/tier: production
    infra.k8/cluster: home
    infra.k8/owner: platform-team
spec:
  data:
    - secretKey: token
      remoteRef:
        key: preview/argocd-ci-token
        property: token
  secretStoreRef:
    name: openbao-backend
    kind: ClusterSecretStore
  refreshInterval: 5m
  target:
    name: argocd-ci-token
