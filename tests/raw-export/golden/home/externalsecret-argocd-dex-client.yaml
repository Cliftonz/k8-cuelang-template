apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: argocd-dex-client
  namespace: argocd
  labels:
    app.kubernetes.io/managed-by: k8-infra
    app.kubernetes.io/part-of: platform
    infra.k8/tier: production
    infra.k8/cluster: home
    infra.k8/owner: platform-team
spec:
  data:
    - secretKey: client_secret
      remoteRef:
        key: home/dex/clients
        property: argocd
  secretStoreRef:
    name: openbao-backend
    kind: ClusterSecretStore
  refreshInterval: 1h
  target:
    name: argocd-dex-client
    template:
      metadata:
        labels:
          app.kubernetes.io/part-of: argocd
