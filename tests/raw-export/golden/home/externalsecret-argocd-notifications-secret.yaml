apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: argocd-notifications-secret
  namespace: argocd
  labels:
    app.kubernetes.io/managed-by: k8-infra
    app.kubernetes.io/part-of: platform
    infra.k8/tier: production
    infra.k8/cluster: home
    infra.k8/owner: platform-team
spec:
  data:
    - secretKey: github-token
      remoteRef:
        key: preview/github-pat
        property: GITHUB_TOKEN
    - secretKey: discord-webhook-url
      remoteRef:
        key: preview/discord-webhook-url
        property: url
  secretStoreRef:
    name: openbao-backend
    kind: ClusterSecretStore
  refreshInterval: 5m
  target:
    name: argocd-notifications-secret
