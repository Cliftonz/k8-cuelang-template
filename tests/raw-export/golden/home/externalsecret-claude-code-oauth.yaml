apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: claude-code-oauth
  namespace: kelos-system
  labels:
    app.kubernetes.io/managed-by: k8-infra
    app.kubernetes.io/part-of: platform
    infra.k8/tier: production
    infra.k8/cluster: home
    infra.k8/owner: platform-team
spec:
  data:
    - secretKey: CLAUDE_CODE_OAUTH_TOKEN
      remoteRef:
        key: preview/claude-oauth-credentials
        property: CLAUDE_CODE_OAUTH_TOKEN
    - secretKey: REFRESH_TOKEN
      remoteRef:
        key: preview/claude-oauth-credentials
        property: REFRESH_TOKEN
    - secretKey: EXPIRES_AT_MS
      remoteRef:
        key: preview/claude-oauth-credentials
        property: EXPIRES_AT_MS
    - secretKey: CLIENT_ID
      remoteRef:
        key: preview/claude-oauth-credentials
        property: CLIENT_ID
    - secretKey: TOKEN_URL
      remoteRef:
        key: preview/claude-oauth-credentials
        property: TOKEN_URL
  secretStoreRef:
    name: openbao-backend
    kind: ClusterSecretStore
  refreshInterval: 5m
  target:
    name: claude-code-oauth
    template:
      metadata:
        annotations:
          kelos.dev/oauth-expires-at: '{{ .EXPIRES_AT_MS }}'
