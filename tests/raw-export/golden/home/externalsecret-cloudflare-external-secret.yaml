apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: cloudflare-external-secret
  namespace: cloudflared
  labels:
    app.kubernetes.io/managed-by: k8-infra
    app.kubernetes.io/part-of: platform
    infra.k8/tier: production
    infra.k8/cluster: home
    infra.k8/owner: platform-team
spec:
  data:
    - secretKey: account_id
      remoteRef:
        key: preview/cloudflare-tunnel
        property: account_id
    - secretKey: tunnel_name
      remoteRef:
        key: preview/cloudflare-tunnel
        property: tunnel_name
    - secretKey: api_token
      remoteRef:
        key: preview/cloudflare-tunnel
        property: api_token
  secretStoreRef:
    name: openbao-backend
    kind: ClusterSecretStore
  refreshInterval: 5m
  target:
    name: cloudflare-external-secret
