apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: cloudflare-provider-creds
  namespace: crossplane-system
  labels:
    app.kubernetes.io/managed-by: k8-infra
    app.kubernetes.io/part-of: platform
    infra.k8/tier: production
    infra.k8/cluster: home
    infra.k8/owner: platform-team
spec:
  data:
    - secretKey: CLOUDFLARE_API_TOKEN
      remoteRef:
        key: preview/cloudflare-provider-token
        property: CLOUDFLARE_API_TOKEN
  secretStoreRef:
    name: openbao-backend
    kind: ClusterSecretStore
  refreshInterval: 5m
  target:
    name: cloudflare-provider-creds
    template:
      data:
        credentials: '{"api_token":"{{ .CLOUDFLARE_API_TOKEN }}"}'
