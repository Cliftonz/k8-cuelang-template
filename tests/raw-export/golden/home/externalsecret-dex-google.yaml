apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: dex-google
  namespace: dex
  labels:
    app.kubernetes.io/managed-by: k8-infra
    app.kubernetes.io/part-of: platform
    infra.k8/tier: production
    infra.k8/cluster: home
    infra.k8/owner: platform-team
spec:
  data:
    - secretKey: client_id
      remoteRef:
        key: home/dex/google
        property: client_id
    - secretKey: client_secret
      remoteRef:
        key: home/dex/google
        property: client_secret
    - secretKey: service_account_json
      remoteRef:
        key: home/dex/google
        property: service_account_json
    - secretKey: admin_email
      remoteRef:
        key: home/dex/google
        property: admin_email
  secretStoreRef:
    name: openbao-backend
    kind: ClusterSecretStore
  refreshInterval: 1h
  target:
    name: dex-google
