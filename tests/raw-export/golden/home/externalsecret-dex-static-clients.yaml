apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: dex-static-clients
  namespace: dex
  labels:
    app.kubernetes.io/managed-by: k8-infra
    app.kubernetes.io/part-of: platform
    infra.k8/tier: production
    infra.k8/cluster: home
    infra.k8/owner: platform-team
spec:
  data:
    - secretKey: argocd
      remoteRef:
        key: home/dex/clients
        property: argocd
    - secretKey: openbao
      remoteRef:
        key: home/dex/clients
        property: openbao
    - secretKey: oauth2proxy
      remoteRef:
        key: home/dex/clients
        property: oauth2proxy
  secretStoreRef:
    name: openbao-backend
    kind: ClusterSecretStore
  refreshInterval: 1h
  target:
    name: dex-static-clients
