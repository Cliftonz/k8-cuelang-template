apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: external-dns-unifi-secret
  namespace: external-dns
  labels:
    app.kubernetes.io/managed-by: k8-infra
    app.kubernetes.io/part-of: platform
    infra.k8/tier: production
    infra.k8/cluster: home
    infra.k8/owner: platform-team
spec:
  data:
    - secretKey: host
      remoteRef:
        key: home/unifi
        property: host
    - secretKey: api_key
      remoteRef:
        key: home/unifi
        property: api_key
    - secretKey: external
      remoteRef:
        key: home/unifi
        property: external
  secretStoreRef:
    name: openbao-backend
    kind: ClusterSecretStore
  refreshInterval: 1h
  target:
    name: external-dns-unifi-secret
