apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: github-webhook-secret
  namespace: argo-events
  labels:
    app.kubernetes.io/managed-by: k8-infra
    app.kubernetes.io/part-of: platform
    infra.k8/tier: production
    infra.k8/cluster: home
    infra.k8/owner: platform-team
spec:
  data:
    - secretKey: webhook-secret
      remoteRef:
        key: preview/github-webhook-secret
        property: webhook-secret
    - secretKey: token
      remoteRef:
        key: preview/github-pat
        property: GITHUB_TOKEN
  secretStoreRef:
    name: openbao-backend
    kind: ClusterSecretStore
  refreshInterval: 5m
  target:
    name: github-webhook-secret
