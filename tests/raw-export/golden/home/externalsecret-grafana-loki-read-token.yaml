apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: grafana-loki-read-token
  namespace: kelos-system
  labels:
    app.kubernetes.io/managed-by: k8-infra
    app.kubernetes.io/part-of: platform
    infra.k8/tier: production
    infra.k8/cluster: home
    infra.k8/owner: platform-team
spec:
  data:
    - secretKey: url
      remoteRef:
        key: home/grafana/loki-read
        property: url
    - secretKey: user_id
      remoteRef:
        key: home/grafana/loki-read
        property: user_id
    - secretKey: token
      remoteRef:
        key: home/grafana/loki-read
        property: token
  secretStoreRef:
    name: openbao-backend
    kind: ClusterSecretStore
  refreshInterval: 1h
  target:
    name: grafana-loki-read-token
