apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: grafana-otlp-token
  namespace: jarvy-telemetry
  labels:
    app.kubernetes.io/managed-by: k8-infra
    app.kubernetes.io/part-of: platform
    infra.k8/tier: production
    infra.k8/cluster: home
    infra.k8/owner: platform-team
spec:
  data:
    - secretKey: instance_id
      remoteRef:
        key: home/jarvy/grafana-otlp-write-token
        property: instance_id
    - secretKey: apikey
      remoteRef:
        key: home/jarvy/grafana-otlp-write-token
        property: token
  secretStoreRef:
    name: openbao-backend
    kind: ClusterSecretStore
  refreshInterval: 1h
  target:
    name: grafana-otlp-token
    template:
      engineVersion: v2
      data:
        token: '{{ printf "%s:%s" .instance_id .apikey | b64enc }}'
