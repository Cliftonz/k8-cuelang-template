apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: hermes-secrets
  namespace: hermes
  labels:
    app.kubernetes.io/managed-by: k8-infra
    app.kubernetes.io/part-of: platform
    infra.k8/tier: production
    infra.k8/cluster: home
    infra.k8/owner: platform-team
spec:
  dataFrom:
    - extract:
        key: users/admin/hermes
  secretStoreRef:
    name: openbao-backend
    kind: ClusterSecretStore
  refreshInterval: 1m
  target:
    name: hermes-secrets
