apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: honcho-secrets
  namespace: honcho
  labels:
    app.kubernetes.io/managed-by: k8-infra
    app.kubernetes.io/part-of: platform
    infra.k8/tier: production
    infra.k8/cluster: home
    infra.k8/owner: platform-team
spec:
  data:
    - secretKey: LLM_OPENAI_API_KEY
      remoteRef:
        key: home/honcho
        property: LLM_OPENAI_API_KEY
  secretStoreRef:
    name: openbao-backend
    kind: ClusterSecretStore
  refreshInterval: 1h
  target:
    name: honcho-secrets
