apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: oauth2-proxy-dex-client
  namespace: oauth-proxy
  labels:
    app.kubernetes.io/managed-by: k8-infra
    app.kubernetes.io/part-of: platform
    infra.k8/tier: production
    infra.k8/cluster: home
    infra.k8/owner: platform-team
spec:
  data:
    - secretKey: client_secret
      remoteRef:
        key: home/dex/clients
        property: oauth2proxy
    - secretKey: cookie_secret
      remoteRef:
        key: home/dex/clients
        property: oauth2proxy_cookie
  secretStoreRef:
    name: openbao-backend
    kind: ClusterSecretStore
  refreshInterval: 1h
  target:
    name: oauth2-proxy-dex-client
    template:
      type: Opaque
      data:
        client-id: oauth2-proxy
        client-secret: '{{ .client_secret }}'
        cookie-secret: '{{ .cookie_secret }}'
