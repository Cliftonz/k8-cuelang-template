apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: pii-salt
  namespace: jarvy-telemetry
  labels:
    app.kubernetes.io/managed-by: k8-infra
    app.kubernetes.io/part-of: platform
    infra.k8/tier: production
    infra.k8/cluster: home
    infra.k8/owner: platform-team
spec:
  data:
    - secretKey: salt
      remoteRef:
        key: home/jarvy/pii-salt
        property: salt
  secretStoreRef:
    name: openbao-backend
    kind: ClusterSecretStore
  refreshInterval: 1h
  target:
    name: pii-salt
