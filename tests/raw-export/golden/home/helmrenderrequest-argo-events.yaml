apiVersion: k8-infra/raw-fallback/v1alpha1
kind: HelmRenderRequest
metadata:
  name: argo-events
  namespace: argo-events
  labels:
    app.kubernetes.io/managed-by: k8-infra
    app.kubernetes.io/part-of: platform
    infra.k8/tier: production
    infra.k8/cluster: home
    infra.k8/owner: platform-team
spec:
  chart:
    name: argo-events
    repository: https://argoproj.github.io/argo-helm
    version: 2.4.22
  values:
    crds:
      install: true
    controller:
      replicas: 1
      resources:
        requests:
          cpu: 100m
          memory: 128Mi
        limits:
          cpu: 500m
          memory: 256Mi
