apiVersion: k8-infra/raw-fallback/v1alpha1
kind: HelmRenderRequest
metadata:
  name: argocd-image-updater
  namespace: argocd
  labels:
    app.kubernetes.io/managed-by: k8-infra
    app.kubernetes.io/part-of: platform
    infra.k8/tier: production
    infra.k8/cluster: home
    infra.k8/owner: platform-team
spec:
  chart:
    name: argocd-image-updater
    repository: https://argoproj.github.io/argo-helm
    version: 1.2.2
  values:
    crds:
      install: true
    config:
      logLevel: debug
      registries:
        - name: GitHub Container Registry
          api_url: https://ghcr.io
          prefix: ghcr.io
          ping: true
          credentials: pullsecret:argocd/ghcr-pull-secret-image-updater
      argocd:
        grpcWeb: true
        serverAddress: argo-cd-argocd-server.argocd.svc:80
        insecure: true
        plaintext: true
    interval: 2m
    resources:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        cpu: 200m
        memory: 256Mi
    extraObjects:
      - apiVersion: argocd-image-updater.argoproj.io/v1alpha1
        kind: ImageUpdater
        metadata:
          name: bb-docs
          namespace: argocd
        spec:
          commonUpdateSettings:
            updateStrategy: digest
            pullSecret: pullsecret:argocd/ghcr-pull-secret-image-updater
          applicationRefs:
            - namePattern: bb-docs
              images:
                - alias: main
                  imageName: ghcr.io/example-org/knowledge-base:latest
                  manifestTargets:
                    helm:
                      name: controllers.main.containers.main.image.repository
                      tag: controllers.main.containers.main.image.tag
              writeBackConfig:
                method: argocd
