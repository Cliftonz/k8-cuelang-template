apiVersion: k8-infra/raw-fallback/v1alpha1
kind: HelmRenderRequest
metadata:
  name: external-dns-unifi
  namespace: external-dns
  labels:
    app.kubernetes.io/managed-by: k8-infra
    app.kubernetes.io/part-of: platform
    infra.k8/tier: production
    infra.k8/cluster: home
    infra.k8/owner: platform-team
spec:
  chart:
    name: external-dns
    repository: https://kubernetes-sigs.github.io/external-dns/
    version: 1.21.1
  values:
    fullnameOverride: external-dns-unifi
    logLevel: info
    provider:
      name: webhook
      webhook:
        image:
          repository: ghcr.io/kashalls/external-dns-unifi-webhook
          tag: v0.8.2
        env:
          - name: UNIFI_HOST
            valueFrom:
              secretKeyRef:
                name: external-dns-unifi-secret
                key: host
          - name: UNIFI_API_KEY
            valueFrom:
              secretKeyRef:
                name: external-dns-unifi-secret
                key: api_key
          - name: UNIFI_EXTERNAL_CONTROLLER
            valueFrom:
              secretKeyRef:
                name: external-dns-unifi-secret
                key: external
          - name: LOG_LEVEL
            value: info
        livenessProbe:
          httpGet:
            path: /healthz
            port: http-webhook
        readinessProbe:
          httpGet:
            path: /readyz
            port: http-webhook
    extraArgs:
      - --ignore-ingress-tls-spec
    policy: sync
    sources:
      - ingress
      - service
    txtOwnerId: k8-infra-home
    txtPrefix: k8s.
    domainFilters:
      - home.example.internal
      - example.internal
      - example.com
    resources:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        cpu: 200m
        memory: 128Mi
