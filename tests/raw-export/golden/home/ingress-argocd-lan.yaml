apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  annotations:
    cert-manager.io/cluster-issuer: openbao-example-internal
    external-dns.alpha.kubernetes.io/target: 192.168.1.235
    gethomepage.dev/enabled: "true"
    gethomepage.dev/name: Argo CD
    gethomepage.dev/group: Platform
    gethomepage.dev/icon: argocd.png
    gethomepage.dev/description: GitOps engine
    gethomepage.dev/href: http://argocd.example.internal
    gethomepage.dev/siteMonitor: http://argocd.example.internal
    gethomepage.dev/pod-selector: app.kubernetes.io/name=argocd-server
  name: argocd-lan
  namespace: argocd
  labels:
    app.kubernetes.io/managed-by: k8-infra
    app.kubernetes.io/part-of: platform
    infra.k8/tier: production
    infra.k8/cluster: home
    infra.k8/owner: platform-team
spec:
  ingressClassName: traefik
  rules:
    - host: argocd.example.internal
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: argo-cd-argocd-server
                port:
                  number: 80
  tls:
    - secretName: argocd-lan-tls
      hosts:
        - argocd.example.internal
