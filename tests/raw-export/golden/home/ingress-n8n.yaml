apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  annotations:
    cert-manager.io/cluster-issuer: openbao-example-internal
    external-dns.alpha.kubernetes.io/target: 192.168.1.235
    gethomepage.dev/enabled: "true"
    gethomepage.dev/name: n8n
    gethomepage.dev/group: Tools
    gethomepage.dev/icon: n8n.png
    gethomepage.dev/description: Workflow automation
    gethomepage.dev/href: http://n8n.example.internal
    gethomepage.dev/namespace: traefik
    gethomepage.dev/pod-selector: app.kubernetes.io/name=traefik
    gethomepage.dev/siteMonitor: http://n8n.example.internal
  name: n8n
  namespace: n8n
  labels:
    app.kubernetes.io/managed-by: k8-infra
    app.kubernetes.io/part-of: platform
    infra.k8/tier: production
    infra.k8/cluster: home
    infra.k8/owner: platform-team
spec:
  ingressClassName: traefik
  rules:
    - host: n8n.example.internal
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: n8n-backend
                port:
                  number: 80
  tls:
    - secretName: n8n-tls
      hosts:
        - n8n.example.internal
