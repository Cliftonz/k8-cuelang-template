apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  annotations:
    cert-manager.io/cluster-issuer: openbao-example-internal
    external-dns.alpha.kubernetes.io/target: 192.168.1.235
    gethomepage.dev/enabled: "true"
    gethomepage.dev/name: OpenBao
    gethomepage.dev/group: Platform
    gethomepage.dev/icon: vault.png
    gethomepage.dev/description: Secret store
    gethomepage.dev/href: http://openbao.example.internal
    gethomepage.dev/siteMonitor: http://openbao.example.internal
    gethomepage.dev/pod-selector: app.kubernetes.io/name=openbao
  name: openbao-lan
  namespace: openbao
  labels:
    app.kubernetes.io/managed-by: k8-infra
    app.kubernetes.io/part-of: platform
    infra.k8/tier: production
    infra.k8/cluster: home
    infra.k8/owner: platform-team
spec:
  ingressClassName: traefik
  rules:
    - host: openbao.example.internal
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: openbao-ui
                port:
                  number: 8200
  tls:
    - secretName: openbao-lan-tls
      hosts:
        - openbao.example.internal
