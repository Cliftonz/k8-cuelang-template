apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  annotations:
    cert-manager.io/cluster-issuer: openbao-example-internal
    external-dns.alpha.kubernetes.io/target: 192.168.1.235
    gethomepage.dev/enabled: "true"
    gethomepage.dev/name: Recipes
    gethomepage.dev/group: Smart Home
    gethomepage.dev/icon: tandoor.png
    gethomepage.dev/description: Household recipe manager
    gethomepage.dev/href: http://recipes.example.internal
    gethomepage.dev/namespace: traefik
    gethomepage.dev/pod-selector: app.kubernetes.io/name=traefik
    gethomepage.dev/siteMonitor: http://recipes.example.internal
  name: recipes
  namespace: recipes
  labels:
    app.kubernetes.io/managed-by: k8-infra
    app.kubernetes.io/part-of: platform
    infra.k8/tier: production
    infra.k8/cluster: home
    infra.k8/owner: platform-team
spec:
  ingressClassName: traefik
  rules:
    - host: recipes.example.internal
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: recipes-backend
                port:
                  number: 80
  tls:
    - secretName: recipes-tls
      hosts:
        - recipes.example.internal
