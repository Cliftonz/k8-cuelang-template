apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  annotations:
    cert-manager.io/cluster-issuer: openbao-example-internal
    external-dns.alpha.kubernetes.io/target: 192.168.1.235
    gethomepage.dev/enabled: "true"
    gethomepage.dev/name: Open WebUI
    gethomepage.dev/group: Tools
    gethomepage.dev/icon: open-webui.png
    gethomepage.dev/description: LLM chat front-end
    gethomepage.dev/href: http://webui.example.internal
    gethomepage.dev/namespace: traefik
    gethomepage.dev/pod-selector: app.kubernetes.io/name=traefik
    gethomepage.dev/siteMonitor: http://webui.example.internal
  name: webui
  namespace: webui
  labels:
    app.kubernetes.io/managed-by: k8-infra
    app.kubernetes.io/part-of: platform
    infra.k8/tier: production
    infra.k8/cluster: home
    infra.k8/owner: platform-team
spec:
  ingressClassName: traefik
  rules:
    - host: webui.example.internal
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: webui-backend
                port:
                  number: 80
  tls:
    - secretName: webui-tls
      hosts:
        - webui.example.internal
