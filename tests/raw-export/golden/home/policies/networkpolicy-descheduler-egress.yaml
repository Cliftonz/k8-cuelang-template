apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: descheduler-egress
  namespace: descheduler
  labels:
    app.kubernetes.io/managed-by: k8-infra
    app.kubernetes.io/part-of: platform
    infra.k8/tier: production
    infra.k8/cluster: home
    infra.k8/owner: platform-team
spec:
  podSelector: {}
  policyTypes:
    - Egress
  egress:
    - to:
        - namespaceSelector: {}
      ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
