apiVersion: v1
kind: Service
metadata:
  name: truenas-backend
  namespace: truenas
  labels:
    app.kubernetes.io/managed-by: k8-infra
    app.kubernetes.io/part-of: platform
    infra.k8/tier: production
    infra.k8/cluster: home
    infra.k8/owner: platform-team
  annotations:
    traefik.ingress.kubernetes.io/service.serversscheme: https
    traefik.ingress.kubernetes.io/service.serverstransport: truenas-insecure-skip-verify@kubernetescrd
spec:
  ports:
    - name: https
      port: 443
      targetPort: 8443
      protocol: TCP
