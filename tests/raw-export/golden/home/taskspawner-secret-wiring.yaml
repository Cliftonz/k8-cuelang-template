apiVersion: kelos.dev/v1alpha1
kind: TaskSpawner
metadata:
  name: secret-wiring
  namespace: kelos-system
  labels:
    app.kubernetes.io/managed-by: k8-infra
    app.kubernetes.io/part-of: platform
    infra.k8/tier: production
    infra.k8/cluster: home
    infra.k8/owner: platform-team
spec:
  maxConcurrency: 1
  pollInterval: 5m
  when:
    githubIssues:
      labels:
        - 'request: secret'
      state: open
      types:
        - issues
      reporting:
        enabled: true
  taskTemplate:
    type: claude-code
    workspaceRef:
      name: k8-infra
    agentConfigRef:
      name: secret-wiring
    credentials:
      type: oauth
      secretRef:
        name: claude-code-oauth
    promptTemplate: |-
      A new secret has been requested via GitHub issue.

      Issue #{{.Number}}: {{.Title}}

      Body:
      {{.Body}}

      Follow the "Step-by-step the AI must follow" section in
      docs/secret-management.md exactly. Open a PR. Stop. Do not
      seed the value.
    branch: secrets/wire-{{.Number}}
    ttlSecondsAfterFinished: 86400
