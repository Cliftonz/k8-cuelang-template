apiVersion: kelos.dev/v1alpha1
kind: TaskSpawner
metadata:
  name: tandoor-mcp-deps-monthly
  namespace: kelos-system
  labels:
    app.kubernetes.io/managed-by: k8-infra
    app.kubernetes.io/part-of: platform
    infra.k8/tier: production
    infra.k8/cluster: home
    infra.k8/owner: platform-team
spec:
  maxConcurrency: 1
  when:
    cron:
      schedule: 0 8 1 * *
  taskTemplate:
    type: claude-code
    workspaceRef:
      name: tandoor-recipe-mcp
    agentConfigRef:
      name: tandoor-mcp-maintainer
    credentials:
      type: oauth
      secretRef:
        name: claude-code-oauth
    promptTemplate: |-
      Monthly dependency-maintenance run for
      example-bot/tandoor-recipe-mcp.

      SCOPE = deps
      Cron tick at {{.Time}} (schedule: {{.Schedule}}).

      Follow your AgentConfig instructions exactly. Update
      patch + minor runtime + dev deps, plus anything needed
      to clear an `npm audit` advisory. Run `npm test`. Bump
      patch version. Open ONE PR titled
      `chore(deps): monthly bump` and enable auto-merge if
      prerequisites hold (see step 10 in your AgentConfig).
      Stop after that.

      If `npm outdated` and `npm audit` are both clean, stop
      without opening a PR.
    ttlSecondsAfterFinished: 86400
