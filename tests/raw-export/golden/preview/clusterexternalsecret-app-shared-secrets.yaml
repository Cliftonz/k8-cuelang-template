apiVersion: external-secrets.io/v1beta1
kind: ClusterExternalSecret
metadata:
  name: app-shared-secrets
  labels:
    app.kubernetes.io/managed-by: k8-infra
    app.kubernetes.io/part-of: platform
    infra.k8/tier: production
    infra.k8/cluster: preview
    infra.k8/owner: platform-team
spec:
  namespaceSelector:
    matchLabels:
      preview: "true"
  externalSecretSpec:
    refreshInterval: 5m
    secretStoreRef:
      name: openbao-backend
      kind: ClusterSecretStore
    target:
      name: app-shared-secrets
      creationPolicy: Owner
    data:
      - secretKey: NEXTAUTH_SECRET
        remoteRef:
          key: preview/app/nextauth-secret
          property: NEXTAUTH_SECRET
      - secretKey: VERCEL_AI_GATEWAY_KEY
        remoteRef:
          key: preview/app/vercel-ai-gateway-key
          property: VERCEL_AI_GATEWAY_KEY
      - secretKey: STRIPE_SECRET_KEY
        remoteRef:
          key: preview/app/stripe-secret-key
          property: STRIPE_SECRET_KEY
      - secretKey: STRIPE_WEBHOOK_SECRET
        remoteRef:
          key: preview/app/stripe-webhook-secret
          property: STRIPE_WEBHOOK_SECRET
      - secretKey: STRIPE_API_KEY
        remoteRef:
          key: preview/app/stripe-cli-key
          property: STRIPE_API_KEY
