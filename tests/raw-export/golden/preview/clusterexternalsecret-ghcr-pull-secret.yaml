apiVersion: external-secrets.io/v1beta1
kind: ClusterExternalSecret
metadata:
  name: ghcr-pull-secret
  labels:
    app.kubernetes.io/managed-by: k8-infra
    app.kubernetes.io/part-of: platform
    infra.k8/tier: production
    infra.k8/cluster: preview
    infra.k8/owner: platform-team
spec:
  namespaceSelector:
    matchLabels:
      preview: "true"
  externalSecretSpec:
    refreshInterval: 5m
    secretStoreRef:
      name: openbao-backend
      kind: ClusterSecretStore
    target:
      name: ghcr-pull-secret
      template:
        type: kubernetes.io/dockerconfigjson
        data:
          .dockerconfigjson: '{"auths":{"ghcr.io":{"auth":"{{ printf "%s:%s" .username .token | b64enc }}"}}}'
    data:
      - secretKey: username
        remoteRef:
          key: preview/github-pat
          property: GITHUB_USER
      - secretKey: token
        remoteRef:
          key: preview/github-pat
          property: GITHUB_TOKEN
