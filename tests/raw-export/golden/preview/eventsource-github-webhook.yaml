apiVersion: argoproj.io/v1alpha1
kind: EventSource
metadata:
  name: github-webhook
  namespace: argo-events
  labels:
    app.kubernetes.io/managed-by: k8-infra
    app.kubernetes.io/part-of: platform
    infra.k8/tier: dev
    infra.k8/cluster: preview
    infra.k8/owner: platform-team
spec:
  service:
    ports:
      - port: 12000
        targetPort: 12000
  webhook:
    pr-events:
      endpoint: /github/pr
      port: "12000"
      method: POST
