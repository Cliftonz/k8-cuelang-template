apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: claude-code-oauth
  namespace: kelos-system
  labels:
    app.kubernetes.io/managed-by: k8-infra
    app.kubernetes.io/part-of: platform
    infra.k8/tier: dev
    infra.k8/cluster: preview
    infra.k8/owner: platform-team
spec:
  data:
    - secretKey: CLAUDE_CODE_OAUTH_TOKEN
      remoteRef:
        key: preview/claude-oauth-credentials
        property: CLAUDE_CODE_OAUTH_TOKEN
    - secretKey: EXPIRES_AT_MS
      remoteRef:
        key: preview/claude-oauth-credentials
        property: EXPIRES_AT_MS
  secretStoreRef:
    name: openbao-backend
    kind: ClusterSecretStore
  refreshInterval: 5m
  target:
    name: claude-code-oauth
    template:
      metadata:
        annotations:
          kelos.dev/oauth-expires-at: '{{ .EXPIRES_AT_MS }}'
