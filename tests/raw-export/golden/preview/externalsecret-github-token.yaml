apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: github-token
  namespace: argocd
  labels:
    app.kubernetes.io/managed-by: k8-infra
    app.kubernetes.io/part-of: platform
    infra.k8/tier: dev
    infra.k8/cluster: preview
    infra.k8/owner: platform-team
spec:
  data:
    - secretKey: token
      remoteRef:
        key: preview/github-pat
        property: GITHUB_TOKEN
  secretStoreRef:
    name: openbao-backend
    kind: ClusterSecretStore
  refreshInterval: 5m
  target:
    name: github-token
