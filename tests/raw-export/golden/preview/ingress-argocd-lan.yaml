apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: argocd-lan
  namespace: argocd
  labels:
    app.kubernetes.io/managed-by: k8-infra
    app.kubernetes.io/part-of: platform
    infra.k8/tier: dev
    infra.k8/cluster: preview
    infra.k8/owner: platform-team
spec:
  ingressClassName: traefik
  rules:
    - host: argocd.preview.example.internal
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: argo-cd-argocd-server
                port:
                  number: 80
